server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  profiles:
    default: demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      request-timeout: 180000
  ai:
    model:
      chat: none
      embedding: none
app:
  mode: demo
  vector-url: ${VECTOR_URL:http://127.0.0.1:8000}
  data-dir: ${APP_DATA_DIR:./data}
  web-origin: ${APP_WEB_ORIGIN:http://localhost:5173}
