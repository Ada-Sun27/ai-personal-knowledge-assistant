app:
  mode: bedrock
spring:
  ai:
    model:
      chat: bedrock-converse
      embedding: bedrock-titan
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
        timeout: 120s
      converse:
        chat:
          options:
            model: ${BEDROCK_CHAT_MODEL:amazon.nova-lite-v1:0}
            temperature: 0.0
            max-tokens: 1024
      titan:
        embedding:
          model: amazon.titan-embed-text-v2:0
