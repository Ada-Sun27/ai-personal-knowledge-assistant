name: Vector retrieval benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: vector-service
      - run: python benchmark.py --output ../benchmark-results.json
        working-directory: vector-service
      - uses: actions/upload-artifact@v4
        with:
          name: vector-benchmark
          path: benchmark-results.json
